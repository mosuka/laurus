[package]
name = "laurus"
version = { workspace = true }
edition = { workspace = true }
description = { workspace = true }
documentation = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
keywords = { workspace = true }
categories = { workspace = true }
license = { workspace = true }
autoexamples = false
autobenches = false

[dependencies]
ahash = { version = "0.8.12", features = [
    "serde",
    "std",
    "compile-time-rng",
], default-features = false }
aho-corasick = "1.1.4"
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.23.1"
bit-vec = "0.10.1"
bitpacking = "0.9.3"
bytecheck = "0.8.3"
byteorder = "1.5.0"
chrono = { workspace = true }
crc32fast = "1.5.0"
csv = "1.4.0"
fst = "0.4.7"
futures = "0.3.33"
lazy_static = "1.5.0"
lindera = { version = "6.0.0" }
lindera-dictionary = { version = "5.3.0", default-features = false }
log = "0.4.33"
lru = "0.18.2"
parking_lot = "0.12.5"
pest = "2.8.8"
pest_derive = "2.8.8"
rand = "0.10.2"
regex = "1.13.1"
rkyv = { version = "0.8.18", features = ["std"] }
roaring = "0.11.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.53.1", features = ["sync", "macros"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
uuid = { version = "1.24.0", features = ["v4", "js"] }
wide = "1.6.1"

# Native-only dependencies (file I/O, threading, mmap)
crossbeam-channel = { version = "0.5.16", optional = true }
crossbeam-deque = { version = "0.8.7", optional = true }
memmap2 = { version = "0.9.11", optional = true }
num_cpus = { version = "1.17.0", optional = true }
rayon = { version = "1.12.0", optional = true }
tempfile = { workspace = true, optional = true }

# Optional embedding dependencies
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
# As of 1.0.0, hf-hub dropped the `ureq`-backed sync client entirely (the
# `api::sync` module and `ureq` feature are both gone) in favor of a
# `blocking` feature that wraps its async client in a dedicated
# single-threaded tokio runtime on a background thread (see
# `hf_hub::blocking::HFClientSync`). hf-hub now depends on reqwest 0.13
# unconditionally, without `default-features = false` on its own Cargo.toml
# entry -- so whether openssl-sys/native-tls (reqwest's default TLS backend)
# ends up in the dependency graph depends entirely on *this* crate's feature
# selection unifying with it elsewhere. Verified via `cargo tree -i
# openssl-sys` / `-i native-tls` with only `["blocking", "rustls-tls"]`
# enabled here: neither appears. openssl-sys cannot cross-compile to
# *-unknown-linux-musl, which is what this pins away.
#
# `blocking` is mandatory, not optional: laurus uses
# `hf_hub::blocking::HFClientSync` (candle_bert_embedder.rs,
# candle_clip_embedder.rs) via `HFClientBuilder::build_sync()`, and hf-hub
# gates the whole `blocking` module behind `#[cfg(feature = "blocking")]`.
hf-hub = { version = "1.0.0", default-features = false, features = [
    "blocking",
    "rustls-tls",
], optional = true }
# Default features include `esaxx_fast` (-> esaxx-rs/cpp), which compiles a
# C++ source file (esaxx.cpp) purely to accelerate Unigram tokenizer
# *training* (tokenizers::models::unigram::trainer). laurus only loads
# pretrained tokenizers via `Tokenizer::from_file` + `encode` and never
# trains one, so this buys nothing here while forcing every build (not just
# musl) to carry a C++ toolchain. Disabling it falls back to the pure-Rust
# `suffix_rs` implementation with no functional change. `candle-core`
# already builds tokenizers this way (`default-features = false,
# features = ["onig"]`).
tokenizers = { version = "0.23.1", default-features = false, features = [
    "onig",
], optional = true }
reqwest = { version = "0.13.4", features = ["json"], optional = true }
image = { version = "0.25.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# TOML (de)serialization for `Schema::from_toml`/`to_toml` and the
# `index_dir` module's `schema.toml` handling. Not needed on wasm32, which
# has neither `index_dir` (no filesystem) nor a use for standalone TOML I/O.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = { workspace = true }

[features]
default = ["native"]
native = [
    "ahash/runtime-rng",
    "tokio/full",
    "dep:crossbeam-channel",
    "dep:crossbeam-deque",
    "dep:memmap2",
    "dep:num_cpus",
    "dep:rayon",
    "dep:tempfile",
]
embeddings-candle = [
    "candle-core",
    "candle-nn",
    "candle-transformers",
    "hf-hub",
    "tokenizers",
]
embeddings-multimodal = [
    "candle-core",
    "candle-nn",
    "candle-transformers",
    "hf-hub",
    "tokenizers",
    "image",
]
embeddings-openai = ["reqwest"]
embeddings-all = [
    "embeddings-candle",
    "embeddings-multimodal",
    "embeddings-openai",
]
# Experimental opt-in for the PQ FastScan integration in HNSW indexes
# (Issue #695 / part D of #651). Enables the SIMD-accelerated K=16
# 4-bit PQ ADC path. The underlying kernels (#692 / #693 / #694) are
# always compiled; this feature only switches on the writer / reader /
# searcher wiring and the `ProductQuantizationFastScan` schema option.
pq-fastscan = []

