[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
# Tests use `embedded://*` URIs to load lindera dictionaries. Cargo's feature
# unification activates these features only for test/example/bench builds, so
# the release library (and downstream bindings) ship without the embedded
# dictionaries.
lindera = { version = "6.0.0", features = [
    "embed-ipadic",
    "embed-ko-dic",
    "embed-cc-cedict",
] }
tokio-test = "0.4.5"

# Used by the cold-cache bench harness in `laurus/benches/common.rs` to
# call `posix_fadvise(POSIX_FADV_DONTNEED)` on Linux. Already a
# transitive runtime dep through other crates, so listing it explicitly
# here adds no compile cost.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.189"
