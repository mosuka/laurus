syntax = "proto3";
package laurus.v1;

// A polymorphic value that can represent any supported data type.
message Value {
  oneof kind {
    bool null_value = 1;
    bool bool_value = 2;
    int64 int64_value = 3;
    double float64_value = 4;
    string text_value = 5;
    bytes bytes_value = 6;
    VectorValue vector_value = 7;
    int64 datetime_value = 8;  // Unix microseconds (UTC)
    GeoPoint geo_value = 9;
    Int64ArrayValue int64_array_value = 10;
    Float64ArrayValue float64_array_value = 11;
    Geo3dPoint geo3d_value = 12;
    GeoArrayValue geo_array_value = 13;
    Geo3dArrayValue geo3d_array_value = 14;
  }
}

// A vector of floating-point values.
message VectorValue {
  repeated float values = 1;
}

// A multi-valued 64-bit signed integer field (Lucene-style "any match" semantics).
message Int64ArrayValue {
  repeated int64 values = 1;
}

// A multi-valued 64-bit floating-point field (Lucene-style "any match" semantics).
message Float64ArrayValue {
  repeated double values = 1;
}

// A geographic point (latitude/longitude).
message GeoPoint {
  double latitude = 1;
  double longitude = 2;
}

// A 3D Earth-Centered Earth-Fixed (ECEF) Cartesian point in meters.
// Origin is the Earth's center of mass; units are meters on every axis.
// Suitable for true 3D geospatial queries (drone proximity, satellite
// tracking, indoor 3D positioning) where altitude is a first-class
// dimension that 2D `GeoPoint` cannot represent.
message Geo3dPoint {
  double x = 1;
  double y = 2;
  double z = 3;
}

// A multi-valued geographic point field (Lucene-style "any match" semantics:
// a document matches a distance / bounding-box query if any of its points
// does, scored by its closest point). Requires `GeoOption.multi_valued`.
message GeoArrayValue {
  repeated GeoPoint values = 1;
}

// A multi-valued 3D ECEF point field (same "any match" semantics for
// `geo3d_distance` / `geo3d_bbox` / `geo3d_nearest`). Requires
// `Geo3dOption.multi_valued`.
message Geo3dArrayValue {
  repeated Geo3dPoint values = 1;
}

// A document consisting of named fields.
message Document {
  map<string, Value> fields = 1;
}
