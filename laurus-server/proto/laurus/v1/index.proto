syntax = "proto3";
package laurus.v1;

// Service for index lifecycle and schema management.
service IndexService {
  // Create a new index with the given schema.
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse);

  // Get index statistics.
  rpc GetIndex(GetIndexRequest) returns (GetIndexResponse);

  // Get the schema of the current index.
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);

  // Dynamically add a new field to the current index.
  rpc AddField(AddFieldRequest) returns (AddFieldResponse);

  // Remove a field from the current index schema.
  rpc DeleteField(DeleteFieldRequest) returns (DeleteFieldResponse);

  // Change an existing field's type/options, optionally rebuilding or
  // discarding its on-disk data.
  rpc UpdateField(UpdateFieldRequest) returns (UpdateFieldResponse);
}

// ---- Schema definitions ----

// The schema describing all fields in an index.
message Schema {
  map<string, FieldOption> fields = 1;
  repeated string default_fields = 2;
  // Custom analyzer definitions, keyed by name.
  map<string, AnalyzerDefinition> analyzers = 3;
  // Embedder definitions, keyed by name.
  map<string, EmbedderConfig> embedders = 4;
  // Policy controlling how fields not declared in `fields` are handled
  // during document ingestion. Defaults to DYNAMIC.
  DynamicFieldPolicy dynamic_field_policy = 5;
  // Fields whose option was changed via UpdateField with a destructive
  // classification (dimension/embedder/distance change, or a change to a
  // non-stored field) and therefore no longer have valid on-disk data
  // matching the current schema. See laurus::Schema::pending_reindex.
  repeated string pending_reindex = 6;
}

// How UpdateField classified a requested field option change. Mirrors
// laurus::engine::schema::FieldChangeKind.
enum FieldChangeKind {
  FIELD_CHANGE_KIND_UNSPECIFIED = 0;
  // Only a schema-level setting changes; no existing on-disk data needs
  // to be touched.
  FIELD_CHANGE_KIND_METADATA_ONLY = 1;
  // Existing on-disk data is rebuilt from stored values.
  FIELD_CHANGE_KIND_REINDEX = 2;
  // The change cannot be applied from existing on-disk data; applying it
  // discards the field's existing data.
  FIELD_CHANGE_KIND_DESTRUCTIVE = 3;
}

// Policy for handling undeclared fields during document ingestion.
enum DynamicFieldPolicy {
  // Treated as DYNAMIC for backward compatibility.
  DYNAMIC_FIELD_POLICY_UNSPECIFIED = 0;
  // Unknown fields cause the ingest to fail.
  DYNAMIC_FIELD_POLICY_STRICT = 1;
  // Unknown fields have their type inferred and are added to the schema.
  DYNAMIC_FIELD_POLICY_DYNAMIC = 2;
  // Unknown fields are silently dropped.
  DYNAMIC_FIELD_POLICY_IGNORE = 3;
}

// A custom analyzer pipeline definition.
message AnalyzerDefinition {
  repeated ComponentConfig char_filters = 1;
  ComponentConfig tokenizer = 2;
  repeated ComponentConfig token_filters = 3;
}

// A generic component configuration (tokenizer, char filter, or token filter).
message ComponentConfig {
  // Component type name (e.g. "whitespace", "lowercase", "unicode_normalization").
  string type = 1;
  // Type-specific parameters as string key-value pairs.
  map<string, string> params = 2;
}

// A field configuration, exactly one variant must be set.
message FieldOption {
  oneof option {
    TextOption text = 1;
    IntegerOption integer = 2;
    FloatOption float = 3;
    BooleanOption boolean = 4;
    DateTimeOption date_time = 5;
    GeoOption geo = 6;
    BytesOption bytes = 7;
    HnswOption hnsw = 8;
    FlatOption flat = 9;
    IvfOption ivf = 10;
    Geo3dOption geo3d = 11;
  }
}

// Lexical field options.

message TextOption {
  bool indexed = 1;
  bool stored = 2;
  // Whether to store term positions for this field ("term vectors").
  // Unset means "use the engine's default" (currently `true`) rather than
  // explicitly `false` — a plain `bool` cannot distinguish the two, which
  // silently forced every field to `false` when a client omitted the
  // field entirely.
  optional bool term_vectors = 3;
  // Analyzer reference. Unset means use the engine default analyzer.
  AnalyzerSpec analyzer = 4;
  // Whether this field's value is also copied into DocValues (the
  // column-oriented store sort/facet/aggregation read from). Unset means
  // "use the engine's default" (currently `true`), for the same reason
  // as `term_vectors` above.
  optional bool doc_values = 5;
}

// Reference to an analyzer for a text field.
//
// One of:
//  - `named`: built-in or user-defined analyzer name (e.g. "standard",
//    "english", "keyword", "simple", "noop", or any name registered in
//    `Schema.analyzers`). Note that the bare name "japanese" is not
//    accepted because the Japanese preset requires a Lindera dictionary
//    path; supply the structured form via `builtin` instead.
//  - `builtin`: parameterized built-in preset (currently only Japanese).
message AnalyzerSpec {
  oneof spec {
    string named = 1;
    BuiltinAnalyzerSpec builtin = 2;
  }
}

// Parameterized built-in analyzer preset. Currently only the Japanese
// preset is supported, but the variant set is expected to grow.
message BuiltinAnalyzerSpec {
  oneof preset {
    JapaneseAnalyzerSpec japanese = 1;
  }
}

// Japanese-language preset built on Lindera.
message JapaneseAnalyzerSpec {
  // Segmentation mode: "normal", "search", or "decompose".
  // Empty string is treated as "normal".
  string mode = 1;
  // Filesystem path to a Lindera dictionary directory (typically IPADIC).
  string dict = 2;
  // Optional user dictionary path. Empty string means none.
  string user_dict = 3;
}

message IntegerOption {
  bool indexed = 1;
  bool stored = 2;
  // When true, the field accepts arrays of integers and range queries
  // match a document if any value satisfies the predicate (Lucene-style).
  bool multi_valued = 3;
  // Whether this field's value is also copied into DocValues. Unset
  // means "use the engine's default" (currently `true`); see
  // `TextOption.doc_values`.
  optional bool doc_values = 4;
}

message FloatOption {
  bool indexed = 1;
  bool stored = 2;
  // When true, the field accepts arrays of floats and range queries
  // match a document if any value satisfies the predicate (Lucene-style).
  bool multi_valued = 3;
  // Whether this field's value is also copied into DocValues. Unset
  // means "use the engine's default" (currently `true`); see
  // `TextOption.doc_values`.
  optional bool doc_values = 4;
}

message BooleanOption {
  bool indexed = 1;
  bool stored = 2;
  // Whether this field's value is also copied into DocValues. Unset
  // means "use the engine's default" (currently `true`); see
  // `TextOption.doc_values`.
  optional bool doc_values = 3;
}

message DateTimeOption {
  bool indexed = 1;
  bool stored = 2;
  // Whether this field's value is also copied into DocValues. Unset
  // means "use the engine's default" (currently `true`); see
  // `TextOption.doc_values`.
  optional bool doc_values = 3;
}

message GeoOption {
  bool indexed = 1;
  bool stored = 2;
  // Whether this field's value is also copied into DocValues. Unset
  // means "use the engine's default" (currently `true`); see
  // `TextOption.doc_values`.
  optional bool doc_values = 3;
}

// Options for 3D ECEF (Earth-Centered Earth-Fixed) geographic point fields.
// Indexed values are stored in a 3D BKD tree and queryable via the
// `geo3d_distance` / `geo3d_bbox` / `geo3d_nearest` DSL forms.
message Geo3dOption {
  bool indexed = 1;
  bool stored = 2;
  // Whether this field's value is also copied into DocValues. Unset
  // means "use the engine's default" (currently `true`); see
  // `TextOption.doc_values`.
  optional bool doc_values = 3;
}

message BytesOption {
  bool stored = 1;
}

// Vector field options.

enum DistanceMetric {
  DISTANCE_METRIC_COSINE = 0;
  DISTANCE_METRIC_EUCLIDEAN = 1;
  DISTANCE_METRIC_MANHATTAN = 2;
  DISTANCE_METRIC_DOT_PRODUCT = 3;
  DISTANCE_METRIC_ANGULAR = 4;
}

enum QuantizationMethod {
  QUANTIZATION_METHOD_NONE = 0;
  QUANTIZATION_METHOD_SCALAR_8BIT = 1;
  QUANTIZATION_METHOD_PRODUCT_QUANTIZATION = 2;
  // PQ FastScan (K=16 4-bit codes + SIMD LUT distance). Issue #695 /
  // part D of #651. Requires the server to be built with the
  // `pq-fastscan` cargo feature; otherwise the conversion path rejects
  // the value with an explicit error.
  QUANTIZATION_METHOD_PRODUCT_QUANTIZATION_FASTSCAN = 3;
}

message QuantizationConfig {
  QuantizationMethod method = 1;
  // Only used when method is PRODUCT_QUANTIZATION.
  uint32 subvector_count = 2;
}

// Stage-2 rerank sidecar storage kind (Issue #481 / #793). Mirrors
// laurus::vector::core::rerank::RerankStorageKind. Selecting a kind on
// an HNSW field makes the writer emit an extra full-precision sidecar
// (`<segment>.hnsw.f32`) so the searcher can rescore int8 candidates
// against the original vectors when a query sets `rerank_factor`.
enum RerankStorageKind {
  // No rerank sidecar (Stage 1, int8-only). Same as omitting the field.
  RERANK_STORAGE_KIND_UNSPECIFIED = 0;
  // Full IEEE-754 single-precision float sidecar (4 bytes per dim).
  RERANK_STORAGE_KIND_F32 = 1;
}

message HnswOption {
  uint32 dimension = 1;
  DistanceMetric distance = 2;
  uint32 m = 3;
  uint32 ef_construction = 4;
  // Relative priority of this field's similarity scores when multiple
  // vector fields are searched together (issue #1084). Unset means "use
  // the engine's default" (currently `1.0`) rather than an explicit
  // `0.0` — a plain `float` cannot distinguish the two, which silently
  // zeroed out every vector score for gRPC/REST-created fields that
  // omitted it.
  optional float base_weight = 5;
  optional QuantizationConfig quantizer = 6;
  // Embedder name (empty = no auto-embedding).
  string embedder = 7;
  // Schema-level default for the `ef_search` candidate-list size used
  // during search. Per-query overrides via the search request still
  // take precedence. When unset, the searcher uses an internal
  // fallback (`50`). Issue #644.
  optional uint32 default_ef_search = 8;
  // Stage-2 rerank sidecar storage (Issue #481 / #793). When set to
  // `F32`, commit emits the `.hnsw.f32` sidecar so searches with
  // `rerank_factor` rescore against full-precision vectors. Unset (or
  // `UNSPECIFIED`) keeps Stage-1 int8-only ranking.
  optional RerankStorageKind rerank_storage = 9;
  // Storage-relative file name of a shared PQ codebook (Issue #631).
  // Only meaningful with a ProductQuantization quantizer: segments are
  // encoded against the named pre-trained codebook (see the
  // `laurus train pq-codebook` CLI command) instead of re-training
  // k-means on every commit and merge. Unset keeps per-segment
  // training.
  optional string pq_codebook_path = 10;
}

message FlatOption {
  uint32 dimension = 1;
  DistanceMetric distance = 2;
  // See `HnswOption.base_weight`.
  optional float base_weight = 3;
  optional QuantizationConfig quantizer = 4;
  // Embedder name (empty = no auto-embedding).
  string embedder = 5;
  // Stage-2 rerank sidecar storage (Issue #481 / #793). Carried through
  // for schema round-tripping; the Flat index does not emit a sidecar
  // yet, so this is currently inert for Flat fields.
  optional RerankStorageKind rerank_storage = 6;
}

message IvfOption {
  uint32 dimension = 1;
  DistanceMetric distance = 2;
  uint32 n_clusters = 3;
  uint32 n_probe = 4;
  // See `HnswOption.base_weight`.
  optional float base_weight = 5;
  optional QuantizationConfig quantizer = 6;
  // Embedder name (empty = no auto-embedding).
  string embedder = 7;
  // Stage-2 rerank sidecar storage (Issue #481 / #793). Carried through
  // for schema round-tripping; the IVF index does not emit a sidecar
  // yet, so this is currently inert for IVF fields.
  optional RerankStorageKind rerank_storage = 8;
}

// An embedder configuration.
message EmbedderConfig {
  // Embedder type name (e.g. "precomputed", "candle_bert", "openai").
  string type = 1;
  // Type-specific parameters (e.g. "model" -> "sentence-transformers/all-MiniLM-L6-v2").
  map<string, string> params = 2;
}

// ---- RPC messages ----

message CreateIndexRequest {
  Schema schema = 1;
}

message CreateIndexResponse {}

message GetIndexRequest {}

message GetIndexResponse {
  uint64 document_count = 1;
  map<string, VectorFieldStats> vector_fields = 2;
}

message VectorFieldStats {
  uint64 vector_count = 1;
  uint64 dimension = 2;
}

message GetSchemaRequest {}

message GetSchemaResponse {
  Schema schema = 1;
}

message AddFieldRequest {
  // The name of the new field to add.
  string name = 1;
  // The field configuration.
  FieldOption field_option = 2;
}

message AddFieldResponse {
  // The updated schema after the field has been added.
  Schema schema = 1;
}

message DeleteFieldRequest {
  // The name of the field to delete.
  string name = 1;
}

message DeleteFieldResponse {
  // The updated schema after the field has been removed.
  Schema schema = 1;
}

message UpdateFieldRequest {
  // The name of the field to update. Must already exist.
  string name = 1;
  // The field's new configuration.
  FieldOption field_option = 2;
  // Required (must be true) to apply a Reindex- or Destructive-classified
  // change; a MetadataOnly change ignores this flag. Rejected otherwise,
  // since a reindex may take time and a destructive change discards
  // existing data.
  bool reindex = 3;
  // When true, classifies the change and returns it without applying
  // anything (the returned schema is the unchanged current schema).
  bool dry_run = 4;
}

message UpdateFieldResponse {
  // How the requested change was classified.
  FieldChangeKind classification = 1;
  // The schema after the update, or -- when dry_run was true, or the
  // change was rejected -- the unchanged current schema.
  Schema schema = 2;
}
