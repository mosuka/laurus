[package]
name = "laurus-server"
version.workspace = true
edition.workspace = true
description = "gRPC server for the Laurus search engine"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
license.workspace = true

[lib]
name = "laurus_server"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
laurus = { workspace = true, features = ["native"] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
embeddings-candle = ["laurus/embeddings-candle"]
embeddings-multimodal = ["laurus/embeddings-multimodal"]
embeddings-openai = ["laurus/embeddings-openai"]
embeddings-all = [
    "embeddings-candle",
    "embeddings-multimodal",
    "embeddings-openai",
]
# Forwards the experimental PQ FastScan integration (Issue #695 /
# part D of #651) from the laurus crate. Enables the
# `ProductQuantizationFastScan` proto<->Rust conversion arms.
pq-fastscan = ["laurus/pq-fastscan"]

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
tempfile = { workspace = true }
# `net` feature provides `TcpListenerStream`, used by the client-server
# bench to serve the gRPC service on an ephemeral port (#727).
tokio-stream = { workspace = true, features = ["net"] }

[[bench]]
name = "search_batch_grpc_bench"
harness = false
