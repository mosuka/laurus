name: Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Detect Changes
  # ------------------------------------------------------------
  # Analyze PR diffs and output change flags for each package.
  # For push (main) / workflow_dispatch, default all flags to true.
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.resolve.outputs.code }}
      laurus: ${{ steps.resolve.outputs.laurus }}
      cli: ${{ steps.resolve.outputs.cli }}
      server: ${{ steps.resolve.outputs.server }}
      mcp: ${{ steps.resolve.outputs.mcp }}
      python: ${{ steps.resolve.outputs.python }}
      nodejs: ${{ steps.resolve.outputs.nodejs }}
      wasm: ${{ steps.resolve.outputs.wasm }}
      ruby: ${{ steps.resolve.outputs.ruby }}
      php: ${{ steps.resolve.outputs.php }}
      interop: ${{ steps.resolve.outputs.interop }}
      snippets: ${{ steps.resolve.outputs.snippets }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      # Detect file changes on PR events only.
      # For push / workflow_dispatch, this step is skipped and
      # the Resolve outputs step falls back to true for all flags.
      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            # code: triggers format + clippy
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'laurus-server/proto/**'
              - '.github/workflows/regression.yml'
            # laurus: core library
            laurus:
              - 'laurus/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/regression.yml'
            # cli: laurus-cli depends on laurus, laurus-mcp
            cli:
              - 'laurus-cli/**'
              - 'laurus/**'
              - 'laurus-mcp/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/regression.yml'
            # server: laurus-server depends on laurus and has proto files
            server:
              - 'laurus-server/**'
              - 'laurus/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/regression.yml'
            # mcp: laurus-mcp depends on laurus
            mcp:
              - 'laurus-mcp/**'
              - 'laurus/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/regression.yml'
            # python: laurus-python depends on laurus
            python:
              - 'laurus-python/**'
              - 'laurus/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/regression.yml'
            # nodejs: laurus-nodejs depends on laurus
            nodejs:
              - 'laurus-nodejs/**'
              - 'laurus/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/regression.yml'
            # ruby: laurus-ruby depends on laurus
            ruby:
              - 'laurus-ruby/**'
              - 'laurus/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/regression.yml'
            # php: laurus-php depends on laurus
            php:
              - 'laurus-php/**'
              - 'laurus/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/regression.yml'
            # wasm: laurus-wasm depends on laurus
            wasm:
              - 'laurus-wasm/**'
              - 'laurus/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/regression.yml'
            # interop: cross-platform index interop check (Issue #947)
            interop:
              - 'laurus/**'
              - 'laurus-cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/interop/**'
              - '.github/workflows/index-interop.yml'
              - '.github/workflows/regression.yml'
            # snippets: binding README / docs / example calls checked against
            # the current positional signatures (Issue #1188)
            snippets:
              - '**/*.md'
              - '**/*.html'
              - '**/*.mjs'
              - '**/*.js'
              - '**/*.cjs'
              - '**/*.ts'
              - '**/*.php'
              - 'laurus-nodejs/src/**'
              - 'laurus-wasm/src/**'
              - 'laurus-php/src/**'
              - 'scripts/check-binding-snippets.py'
              - '.github/workflows/regression.yml'

      # For non-PR events (push / workflow_dispatch), filter outputs are empty.
      # Default to true so all jobs run.
      - name: Resolve outputs
        id: resolve
        env:
          CODE: ${{ steps.filter.outputs.code }}
          LAURUS: ${{ steps.filter.outputs.laurus }}
          CLI: ${{ steps.filter.outputs.cli }}
          SERVER: ${{ steps.filter.outputs.server }}
          MCP: ${{ steps.filter.outputs.mcp }}
          PYTHON: ${{ steps.filter.outputs.python }}
          NODEJS: ${{ steps.filter.outputs.nodejs }}
          WASM: ${{ steps.filter.outputs.wasm }}
          RUBY: ${{ steps.filter.outputs.ruby }}
          PHP: ${{ steps.filter.outputs.php }}
          INTEROP: ${{ steps.filter.outputs.interop }}
          SNIPPETS: ${{ steps.filter.outputs.snippets }}
        run: |
          echo "code=${CODE:-true}" >> "$GITHUB_OUTPUT"
          echo "laurus=${LAURUS:-true}" >> "$GITHUB_OUTPUT"
          echo "cli=${CLI:-true}" >> "$GITHUB_OUTPUT"
          echo "server=${SERVER:-true}" >> "$GITHUB_OUTPUT"
          echo "mcp=${MCP:-true}" >> "$GITHUB_OUTPUT"
          echo "python=${PYTHON:-true}" >> "$GITHUB_OUTPUT"
          echo "nodejs=${NODEJS:-true}" >> "$GITHUB_OUTPUT"
          echo "wasm=${WASM:-true}" >> "$GITHUB_OUTPUT"
          echo "ruby=${RUBY:-true}" >> "$GITHUB_OUTPUT"
          echo "php=${PHP:-true}" >> "$GITHUB_OUTPUT"
          echo "interop=${INTEROP:-true}" >> "$GITHUB_OUTPUT"
          echo "snippets=${SNIPPETS:-true}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Binding snippet guard (Issue #1188): README / docs / example calls
  # to the Node.js, WASM and PHP bindings must match the current
  # positional signatures
  # ============================================================
  snippets:
    name: Binding Snippets
    needs: [changes]
    if: needs.changes.outputs.snippets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Check binding snippet argument positions
        run: python3 scripts/check-binding-snippets.py

  # ============================================================
  # Format code with rustfmt
  # ============================================================
  format:
    name: Format
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Run format
        run: cargo fmt --all -- --check

  # ============================================================
  # Lint with clippy
  # ============================================================
  clippy:
    name: Clippy
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Install protoc
        uses: ./.github/actions/install-protoc
        with:
          version: "24.4"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-x86_64-unknown-linux-gnu"

      - name: Run clippy
        run: cargo clippy --all-targets --features embeddings-all -- -D warnings

      - name: Assert laurus-cli links no OpenSSL
        run: |
          set -euo pipefail
          # Guards the musl release binaries: openssl-sys cannot cross-compile
          # to *-unknown-linux-musl. Historically it entered the graph via
          # hf-hub's default features (default-tls -> native-tls -> openssl-sys).
          #
          # NOTE: grepping Cargo.lock is NOT a valid guard here -- the
          # workspace lock legitimately contains openssl-sys via
          # laurus-php -> ext-php-rs. Only the laurus-cli sub-graph matters.
          if cargo tree -p laurus-cli --features embeddings-all \
               --target x86_64-unknown-linux-musl -i openssl-sys >/dev/null 2>&1; then
            echo "ERROR: openssl-sys reappeared in the laurus-cli dependency graph:" >&2
            cargo tree -p laurus-cli --features embeddings-all \
              --target x86_64-unknown-linux-musl -i openssl-sys >&2
            exit 1
          fi

  # ============================================================
  # Test laurus (core library)
  # ============================================================
  test-laurus:
    name: Test laurus
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.laurus == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            skip_embedding_features: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            # Windows x embeddings-all is covered weekly by periodic.yml;
            # skipping it here keeps this leg off the PR critical path.
            skip_embedding_features: true
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.toolchain }}-${{ matrix.platform.target }}"

      - name: Run test
        shell: bash
        run: |
          # pq-fastscan rides along on every platform (Issue #920): its
          # feature-gated tests would otherwise never run in CI, and the
          # 3-platform matrix exercises the AVX2 / NEON / scalar kernel
          # dispatch paths.
          if [ "${{ matrix.platform.skip_embedding_features }}" == "true" ]; then
            FEATURES="--features pq-fastscan"
          else
            FEATURES="--features embeddings-all,pq-fastscan"
          fi

          cargo test --package laurus --target "${{ matrix.platform.target }}" $FEATURES

  # ============================================================
  # Test laurus-server
  # ============================================================
  test-server:
    name: Test laurus-server
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.server == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            skip_embedding_features: true
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Install protoc
        uses: ./.github/actions/install-protoc
        with:
          version: "24.4"

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.toolchain }}-${{ matrix.platform.target }}"

      - name: Run test
        shell: bash
        run: |
          if [ "${{ matrix.platform.skip_embedding_features }}" == "true" ]; then
            FEATURES=""
          else
            FEATURES="--features embeddings-all"
          fi

          cargo test --package laurus-server --target "${{ matrix.platform.target }}" $FEATURES

  # ============================================================
  # Test laurus-mcp
  # ============================================================
  test-mcp:
    name: Test laurus-mcp
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.mcp == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            skip_embedding_features: true
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Install protoc
        uses: ./.github/actions/install-protoc
        with:
          version: "24.4"

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.toolchain }}-${{ matrix.platform.target }}"

      - name: Run test
        shell: bash
        run: |
          if [ "${{ matrix.platform.skip_embedding_features }}" == "true" ]; then
            FEATURES=""
          else
            FEATURES="--features embeddings-all"
          fi

          cargo test --package laurus-mcp --target "${{ matrix.platform.target }}" $FEATURES

  # ============================================================
  # Test laurus-cli
  # ============================================================
  test-cli:
    name: Test laurus-cli
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            skip_embedding_features: true
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Install protoc
        uses: ./.github/actions/install-protoc
        with:
          version: "24.4"

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.toolchain }}-${{ matrix.platform.target }}"

      - name: Run test
        shell: bash
        run: |
          if [ "${{ matrix.platform.skip_embedding_features }}" == "true" ]; then
            FEATURES=""
          else
            FEATURES="--features embeddings-all"
          fi

          cargo test --package laurus-cli --target "${{ matrix.platform.target }}" $FEATURES

  # ============================================================
  # Test laurus-python
  # ============================================================
  test-python:
    name: Test laurus-python
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.python == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            skip_embedding_features: true
        python: ["3.13"]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-${{ matrix.platform.target }}"

      - name: Run tests
        working-directory: laurus-python
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" == "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pip install maturin pytest
          if [ "${{ matrix.platform.skip_embedding_features }}" == "true" ]; then
            maturin develop
          else
            maturin develop --features embeddings-all
          fi
          pytest tests/ -v

  # ============================================================
  # Test laurus-nodejs
  # ============================================================
  test-nodejs:
    name: Test laurus-nodejs
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.nodejs == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-${{ matrix.platform.target }}"

      - name: Run tests
        working-directory: laurus-nodejs
        shell: bash
        run: |
          npm install
          npm run build:debug
          npm test

      # Offline examples (Issue #1188): they exercise the public API the
      # way the README shows it, and fail loudly when a snippet drifts.
      - name: Run offline examples
        working-directory: laurus-nodejs
        shell: bash
        run: |
          node examples/quickstart.mjs
          node examples/external-embedder.mjs

  # ============================================================
  # Test laurus-wasm
  # ============================================================
  test-wasm:
    name: Test laurus-wasm
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.wasm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-wasm32-unknown-unknown"

      - name: Build
        run: cargo build -p laurus-wasm --target wasm32-unknown-unknown

      - name: Run clippy
        run: cargo clippy -p laurus-wasm --target wasm32-unknown-unknown --tests -- -D warnings

  # ============================================================
  # Test laurus-ruby
  # ============================================================
  test-ruby:
    name: Test laurus-ruby
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.ruby == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
        ruby: ["4.0"]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: laurus-ruby

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "stable-${{ matrix.platform.target }}"

      - name: Run tests
        working-directory: laurus-ruby
        shell: bash
        run: |
          bundle install
          bundle exec rake compile
          bundle exec ruby -Ilib -Itest -e 'Dir["test/test_*.rb"].each { |f| require_relative f }'

  # ============================================================
  # Test laurus-php
  # ============================================================
  test-php:
    name: Test laurus-php
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.php == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            skip_embedding_features: true
        php: ["8.5"]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk-space

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # -ci suffix: this leg builds with --profile ci (no LTO), which
          # must not share a cache entry with the debug-profile test jobs
          # or the full-LTO release.yml builds using the same target triple.
          shared-key: "stable-${{ matrix.platform.target }}-ci"

      - name: Build PHP extension
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export RUSTFLAGS="-C link-args=-Wl,-undefined,dynamic_lookup"
          fi
          if [ "${{ matrix.platform.skip_embedding_features }}" == "true" ]; then
            cargo build --profile ci -p laurus-php
          else
            cargo build --profile ci -p laurus-php --features embeddings-all
          fi

      - name: Run tests
        working-directory: laurus-php
        shell: bash
        run: |
          composer install
          php -d extension=../target/ci/liblaurus_php.so vendor/bin/phpunit tests/LaurusTest.php

      # Offline example (Issue #1188): runs against the extension built
      # above and fails loudly when a snippet drifts from the API.
      - name: Run offline example
        working-directory: laurus-php
        shell: bash
        run: php -d extension=../target/ci/liblaurus_php.so examples/lexical_search.php

  # ============================================================
  # Cross-platform index interop (Issue #947)
  # ------------------------------------------------------------
  # Verifies that an index built on macOS(aarch64) can be searched
  # and written to from Linux(x86_64) with matching results.
  # ============================================================
  index-interop:
    name: Index Interop
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.interop == 'true' }}
    uses: ./.github/workflows/index-interop.yml

  # ============================================================
  # Gate: ensure all tests pass
  # ============================================================
  test-all:
    name: Test All
    # DAG jobs above depend only on `changes`, so a lint failure no longer
    # skips them transitively -- format/clippy must be listed explicitly to
    # keep gating on lint. `!cancelled()` (rather than `!failure() &&
    # !cancelled()`) lets this step run even when a need was cancelled, so
    # the explicit result check below can tell "cancelled" apart from
    # "succeeded" instead of both silently passing.
    if: ${{ !cancelled() }}
    needs:
      [
        format,
        clippy,
        test-laurus,
        test-cli,
        test-server,
        test-mcp,
        test-python,
        test-nodejs,
        test-wasm,
        test-ruby,
        test-php,
        index-interop,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check that no required job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "ERROR: at least one required job failed" >&2
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
