[workspace]
members = [
    "laurus",
    "laurus-cli",
    "laurus-server",
    "laurus-mcp",
    "laurus-python",
    "laurus-nodejs",
    "laurus-wasm",
    "laurus-ruby",
    "laurus-php",
]
resolver = "2"

[workspace.package]
version = "0.13.2"
edition = "2024"
rust-version = "1.85"
description = "Unified search library for lexical, vector, and semantic retrieval"
documentation = "https://docs.rs/laurus"
homepage = "https://github.com/mosuka/laurus"
repository = "https://github.com/mosuka/laurus"
readme = "README.md"
keywords = ["search", "vector", "lexical", "hybrid", "library"]
categories = ["text-processing"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dialoguer = "0.12.0"
laurus = { version = "0.13.2", path = "laurus", default-features = false }
laurus-mcp = { version = "0.13.2", path = "laurus-mcp" }
laurus-server = { version = "0.13.2", path = "laurus-server" }
prost = "0.14.4"
rmcp = { version = "3.1.2", features = ["server", "transport-io"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabled = "0.22.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.4"
tonic = "0.14.6"
tonic-build = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true

# Verification-only builds (CI interop/extension checks that never ship):
# same optimizations as release minus full LTO, which dominates build time
# for a throwaway binary.
[profile.ci]
inherits = "release"
lto = false

# Speeds up the HNSW/PQ recall integration tests (laurus/tests/), which spend
# most of their time in unoptimized numeric kernels. Scoped to this package
# only: laurus/tests/ compiles 88 separate test binaries, and bumping the
# dev profile's opt-level globally would add more compile time than it saves.
[profile.dev.package.laurus]
opt-level = 2
